name: slipwise
description: "A new Flutter project."
publish_to: "none"
version: 1.2.0+2

environment:
  sdk: ^3.10.7

dependencies:
  sentry_flutter: ^9.27.0
  badges: ^3.1.2
  connectivity_plus: ^7.3.1
  dart_either: ^2.0.0
  dio: ^5.11.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^22.2.0
  flutter_native_splash: ^2.4.7
  flutter_secure_storage: ^10.0.0
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.0.0
  flutter_markdown: ^0.7.3
  freezed_annotation: ^3.1.0
  go_router: ^17.4.0
  google_fonts: ^6.3.2
  google_sign_in: ^6.2.1
  hooks_riverpod: ^3.0.3
  intl: ^0.20.2
  json_annotation: 4.9.0
  riverpod_annotation: ^3.0.3 # Changed from 3.0.0 to 4.0.3
  shadcn_ui: ^0.53.6
  shared_preferences: ^2.5.5
  timeago: ^3.7.1
  uuid: ^4.6.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  package_info_plus: ^10.2.1
  shorebird_code_push: ^2.0.7

dev_dependencies:
  sentry_dart_plugin: ^3.4.0
  build_runner: 2.10.5
  custom_lint: ^0.8.1
  flutter_lints: ">=3.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
  freezed: ^3.1.0
  json_serializable: 6.11.2
  riverpod_generator: ^3.0.3

flutter_native_splash:
  color: "#0c0a09"
  image: assets/image/green.png
  android: true
  ios: false
  android_12:
    image: assets/image/green.png
    icon_background_color: "#0c0a09"
    color: "#0c0a09"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/image/green.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0c0a09"
  adaptive_icon_foreground: "assets/image/green.png"

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/drawables/logo/
    - assets/drawables/states/
    - assets/image/
    - assets/drawables/
    - assets/legal/
    - shorebird.yaml

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter/Inter-Regular.ttf
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter/Inter-Black.ttf
          weight: 900

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: toluwalase-abiola
