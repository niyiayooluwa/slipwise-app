name: Shorebird Build (Release / Patch)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Choose build type'
        required: true
        type: choice
        options:
          - release
          - patch

jobs:
  build:
    name: Build Shorebird ${{ github.event.inputs.build_type }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Install Dependencies
        run: flutter pub get

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+[0-9]*//')
          BUILD_NUMBER=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          echo "tag=v${VERSION}+${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "title=Release v${VERSION} (Build ${BUILD_NUMBER})" >> $GITHUB_OUTPUT

      - name: Setup Android Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat << EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Shorebird Release
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: shorebird release android --artifact=apk --target-platform=android-arm64
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Shorebird Patch
        if: ${{ github.event.inputs.build_type == 'patch' }}
        run: shorebird patch android
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Rename APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: mv build/app/outputs/apk/release/app-release.apk build/app/outputs/apk/release/SlipWise.apk

      - name: Upload APK Artifact
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: slipwise-shorebird-apk
          path: build/app/outputs/apk/release/SlipWise.apk
          retention-days: 7

      # Automatically publish to GitHub Releases
      - name: Create GitHub Release
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: ${{ steps.get_version.outputs.title }}
          files: build/app/outputs/apk/release/SlipWise.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
